[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dbx-agentic-psp-workshop"
version = "0.1.0"
description = "Four-hour workshop: deterministic PSP merchant-risk quality on Lakeflow"
requires-python = ">=3.11,<3.14"
dependencies = [
    "databricks-sdk>=0.20.0",
    "pyarrow>=14.0.0",
    "pyspark[pipelines]==4.2.0",
    "dbldatagen==0.4.0.post1",
    "numpy>=1.26,<2.4",
    "pandas>=2.0,<3.0",
    "databricks-labs-dqx==0.16.0",
    "pyyaml>=6.0,<7.0",
]

[tool.setuptools.packages.find]
include = ["gen*"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint.per-file-ignores]
"pipelines/src/*.py" = ["F821"]
