contract: PSPPaymentContract/v1
version: 1.0.0
seed: 22082026
transaction_count: 100000
focus_merchant: m-007
default_currency: USD
allowed_currencies: [USD, GBP, CAD, AUD]
allowed_processors: [stripe, adyen]
entities:
  merchants:
    primary_key: merchant_id
    required: [merchant_id, merchant_name, country, risk_tier]
  orders:
    primary_key: order_id
    foreign_keys:
      merchant_id: merchants.merchant_id
    required: [order_id, merchant_id, order_ts, amount_cents, currency]
  transactions:
    primary_key: txn_id
    foreign_keys:
      order_id: orders.order_id
      merchant_id: merchants.merchant_id
    required: [txn_id, order_id, merchant_id, event_ts, amount_cents, currency, processor, status]
  disputes:
    primary_key: dispute_id
    foreign_keys:
      txn_id: transactions.txn_id
    required: [dispute_id, txn_id, opened_at, closed_at, reason, status]
batches:
  batch-001:
    transactions: 98791
    purpose: healthy baseline
  batch-002-incident:
    transactions: 1209
    purpose: seven quarantine causes and one held valid replay
quality:
  invalid_rows_are_preserved: true
  result_columns: [_errors, _warnings]
gold:
  table: gold_merchant_risk
  grain: merchant_id
  risk_score:
    quarantine_rows_per_point: 50
    chargeback_points: 20
    before_replay: 25
    after_replay: 45
