contract: PSPDQXRules/v1
transactions:
  - name: txn_id_is_null
    criticality: error
    check:
      function: is_not_null
      arguments:
        column: txn_id
  - name: txn_id_is_duplicate
    criticality: error
    check:
      function: is_unique
      arguments:
        columns: [txn_id]
  - name: amount_is_not_positive
    criticality: error
    check:
      function: is_not_less_than
      arguments:
        column: amount_cents
        limit: 1
  - name: currency_is_not_authorized
    criticality: error
    check:
      function: is_in_list
      arguments:
        column: currency
        allowed: ["'USD'", "'GBP'", "'CAD'", "'AUD'"]
  - name: processor_is_unknown
    criticality: error
    check:
      function: is_in_list
      arguments:
        column: processor
        allowed: ["'stripe'", "'adyen'"]
  - name: order_is_orphan
    criticality: error
    check:
      function: sql_expression
      arguments:
        expression: _order_exists
        msg: order_id does not exist in orders
        name: order_is_orphan
disputes:
  - name: dispute_id_is_null
    criticality: error
    check:
      function: is_not_null
      arguments:
        column: dispute_id
  - name: dispute_closes_before_open
    criticality: error
    check:
      function: sql_expression
      arguments:
        expression: to_timestamp(closed_at) >= to_timestamp(opened_at)
        msg: closed_at is earlier than opened_at
        name: dispute_closes_before_open
