resources:
  pipelines:
    workshop_pipeline:
      name: dbx-agentic-psp-${bundle.target}
      catalog: ${var.catalog}
      schema: ${resources.schemas.workshop_schema.name}
      serverless: true
      continuous: false
      libraries:
        - file:
            path: ../src/bronze.py
        - file:
            path: ../src/silver.py
        - file:
            path: ../src/outputs.py
        - file:
            path: ../src/gold.py
      environment:
        environment_version: "4"
        dependencies:
          - databricks-labs-dqx==0.16.0
      configuration:
        landing_path: /Volumes/${var.catalog}/${var.schema}/${var.landing_volume}
        schema_tracking_path: /Volumes/${var.catalog}/${var.schema}/${var.landing_volume}/_schemas
        dqx_rules_path: ${workspace.file_path}/configs/dqx-rules.yaml
        source_format: cloudFiles
        workshop.local: "false"
