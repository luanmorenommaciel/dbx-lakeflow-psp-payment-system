api_version: taskspec.dev/v1
kind: TaskPlan
approved: true
metadata:
  name: dbx-agentic-workshop-readiness
  source: docs/plans/workshop-readiness-plan.md
units:
  - id: T-20260821-workshop-compatibility
    title: Prove the Free Edition workshop toolchain
    effort: L
    profile: full
    agent: any
    execution_backend: codex
    required_tools: [databricks, uv, spark-pipelines, pytest, git]
    depends_on: []
    touches_paths: [pyproject.toml]
    creates_paths:
      - toolchain.lock.yaml
      - uv.lock
      - tests/compatibility/
    source_note: docs/plans/workshop-readiness-plan.md sections 2 and 7
    why: dbldatagen predates Spark 4.2 and DQX 0.16.0 is new, so the exact local and Free Edition tuple must be proven before the workshop is built around it.
    goal: Pin and verify Databricks CLI, Spark SDP, pipeline environment, DQX, dbldatagen, Python, and Agent Skills versions locally and on the instructor Free Edition workspace.
    done_condition: A compatibility receipt records exact versions and passes the minimal deterministic generator plus DQX pipeline checks, with explicit states for Genie Code and Genie Spaces.
    context: The instructor host is supplied through a Databricks profile and never committed. Remote mutation requires separate rehearsal authorization.
    do_not_touch: [pipelines/, gen/, data/, .claude/settings.local.json]
    anti_patterns:
      - Use floating latest dependency ranges.
      - Treat a local import as proof of serverless compatibility.
      - Claim Genie Spaces are available before workspace preflight.
    rollback: Remove the isolated workshop environment and restore only files changed by this unit.
    observability: Record command, version, timestamp, host, state, and sanitized output digest for every compatibility gate.
    behaviors:
      - id: B-1
        given: a clean local environment and authenticated instructor profile
        when: the compatibility matrix runs
        then: every candidate pin has a local and applicable remote pass or an explicit blocker
      - id: B-2
        given: the same generator seed is executed twice
        when: logical manifests are compared
        then: their entity counts, incident IDs, and content digests match
    evals:
      - id: eval_1
        description: pinned dependency environment is reproducible
        command: uv sync --frozen
        verifies: [B-1]
        expected_duration_sec: 180
      - id: eval_2
        description: compatibility smoke tests pass
        command: uv run pytest -q tests/compatibility
        verifies: [B-1, B-2]
        terminal: true
        expected_duration_sec: 600

  - id: T-20260821-workshop-contracts
    title: Freeze payment and multi-agent contracts
    effort: L
    profile: full
    agent: any
    execution_backend: codex
    required_tools: [databricks, claude, codex, pytest, git]
    depends_on: [T-20260821-workshop-compatibility]
    touches_paths: []
    creates_paths:
      - AGENTS.md
      - CLAUDE.md
      - configs/contracts/
      - scripts/install_agent_skills.sh
      - tests/contract/
    source_note: live landing page and docs/plans/workshop-readiness-plan.md sections 3 and 6
    why: Claude Code and Codex need the same plan-before-edit, dev-only, evidence-preserving authority contract.
    goal: Create one canonical agent contract, two agent-facing projections, an executable four-entity payment contract, and project-scope Databricks Agent Skills bootstrap.
    done_condition: Contract tests prove projection consistency, exact entities/incidents, dev-only authority, and skill discovery for Claude Code and Codex.
    context: AGENTS.md is vendor-neutral; CLAUDE.md is the Claude-specific adapter and starts in plan mode.
    do_not_touch: [.claude/kb/, .claude/agents/, pipelines/, gen/, data/]
    anti_patterns:
      - Duplicate independent rules across AGENTS.md and CLAUDE.md.
      - Allow agent-driven deployment without human approval.
      - Commit tokens or Databricks profile contents.
    rollback: Remove generated projections and project-installed Databricks skills without touching existing custom Claude skills.
    observability: Skill list and contract digests are captured without credentials.
    behaviors:
      - id: B-1
        given: either Claude Code or Codex reads the repository
        when: it proposes workshop changes
        then: it stays within declared paths, preserves quarantine, targets dev, and stops before deploy
      - id: B-2
        given: project-scope skills are installed
        when: the skill inventory is listed
        then: the selected Databricks skills are discoverable for both agents
    evals:
      - id: eval_1
        description: validate data and agent contracts
        command: uv run pytest -q tests/contract
        verifies: [B-1]
        terminal: true
        expected_duration_sec: 60
      - id: eval_2
        description: verify selected project skills
        command: databricks aitools list --scope project
        verifies: [B-2]
        expected_duration_sec: 30

  - id: T-20260821-workshop-generator
    title: Build the deterministic dbldatagen incident generator
    effort: L
    profile: full
    agent: python-developer
    execution_backend: codex
    required_tools: [uv, pytest, spark-pipelines, databricks]
    depends_on: [T-20260821-workshop-contracts]
    touches_paths:
      - configs/contracts/
    creates_paths:
      - gen/synthetic/
      - tests/generator/
      - data/fallback/
    source_note: landing promise for dbldatagen, 100k transactions, and eight incidents
    why: The current ShadowTraffic seven-entity generator is too broad and is not deterministic in the form the workshop needs.
    goal: Generate batch-001 and batch-002-incident for four entities using dbldatagen with seed 22082026 and an exact manifest.
    done_condition: Two runs produce identical logical manifests, exactly 100000 transaction rows, valid relationships outside the declared incidents, and all eight incident IDs.
    context: The checked-in fallback pack is produced from the same generator and verified by digest.
    do_not_touch: [gen/, data/, pipelines/]
    anti_patterns:
      - Use random values without a fixed seed.
      - Hide incident construction in opaque post-processing.
      - Count the late valid chargeback as a rejected row.
    rollback: Remove workshop generator outputs and restore the previous lockfile.
    observability: Emit counts, seed, batch IDs, incident IDs, and logical content digests.
    behaviors:
      - id: B-1
        given: seed 22082026 and the payment contract
        when: the generator executes twice
        then: both logical manifests match and contain exactly 100000 transactions
      - id: B-2
        given: batch-002-incident
        when: its manifest is inspected
        then: all eight named incident conditions are present with stable sentinel IDs
    evals:
      - id: eval_1
        description: generator determinism and count tests pass
        command: uv run pytest -q tests/generator
        verifies: [B-1, B-2]
        terminal: true
        expected_duration_sec: 300

  - id: T-20260821-workshop-baseline-tracer
    title: Deliver the baseline medallion tracer bullet
    effort: L
    profile: full
    agent: data-engineer
    execution_backend: codex
    required_tools: [uv, spark-pipelines, pytest]
    depends_on: [T-20260821-workshop-generator]
    touches_paths:
      - pyproject.toml
      - configs/contracts/psp-payment.contract.yaml
    creates_paths:
      - pipelines/spark-pipeline.yaml
      - pipelines/src/psp-agentic/
      - tests/pipeline/
    source_note: landing promises for Bronze, Silver, Gold, and Lakeflow
    why: A complete healthy-data path proves the four-entity model and one-pipeline graph before incident behavior is layered in.
    goal: Ingest batch-001 through four Bronze streaming tables, valid Silver tables, and gold_merchant_risk using pyspark.pipelines.
    done_condition: Local Spark 4.2 dry-run/run succeeds, Bronze preserves metadata, Silver contains all baseline rows, and Gold has deterministic healthy risk results.
    context: Pipeline definition functions remain declarative and contain no writes, counts, collects, or other actions.
    do_not_touch: [pipelines/, gen/, data/]
    anti_patterns:
      - Create one pipeline per medallion layer.
      - Use legacy import dlt in new workshop code.
      - Perform side effects in dataset-definition functions.
    rollback: Remove the workshop pipeline code and local SDP storage.
    observability: Assert graph nodes, row counts, metadata columns, and Gold metrics.
    behaviors:
      - id: B-1
        given: batch-001 is available
        when: the pipeline runs
        then: four Bronze tables, valid Silver tables, and gold_merchant_risk materialize in one graph
    evals:
      - id: eval_1
        description: local pipeline graph is valid
        command: ./scripts/sdp.sh dry-run --spec pipelines/spark-pipeline.yaml
        verifies: [B-1]
        expected_duration_sec: 180
      - id: eval_2
        description: baseline pipeline assertions pass
        command: uv run pytest -q tests/pipeline -k baseline
        verifies: [B-1]
        terminal: true
        expected_duration_sec: 300

  - id: T-20260821-workshop-incident-tracer
    title: Deliver the DQX quarantine and replay tracer bullet
    effort: L
    profile: full
    agent: data-quality-engineer
    execution_backend: codex
    required_tools: [uv, spark-pipelines, pytest]
    depends_on: [T-20260821-workshop-baseline-tracer]
    touches_paths:
      - pipelines/src/psp-agentic/silver.py
      - pipelines/src/psp-agentic/gold.py
      - tests/pipeline/
    creates_paths:
      - configs/dqx-rules.yaml
      - scripts/release_incident.sh
    source_note: landing promise for DQX, quarantine, and eight incidents
    why: The existing implementation silently drops failed expectations, while the workshop promises explainable quarantine and replay.
    goal: Apply one DQX rule source, route seven invalid conditions to quarantine, and let the late valid chargeback update merchant risk.
    done_condition: Every invalid sentinel remains queryable with errors or warnings, valid rows remain in Silver, and replay changes the expected merchant risk score.
    context: Do not duplicate domain rules as Lakeflow expectations.
    do_not_touch: [pipelines/, gen/, data/]
    anti_patterns:
      - Use ON VIOLATION DROP ROW.
      - Duplicate DQX rules in decorators or SQL constraints.
      - Mix the valid late event into quarantine.
    rollback: Remove incident-specific rules and replay release while leaving baseline tracer intact.
    observability: Record DQX summary metrics, quarantine reason counts, and Gold before/after values.
    behaviors:
      - id: B-1
        given: batch-002-incident is released
        when: DQX checks execute
        then: seven invalid conditions are preserved in quarantine with explainable metadata
      - id: B-2
        given: the held late chargeback is released
        when: the incremental pipeline reruns
        then: it passes Silver and changes the named merchant risk result deterministically
    evals:
      - id: eval_1
        description: incident routing and replay assertions pass
        command: uv run pytest -q tests/pipeline -k incident
        verifies: [B-1, B-2]
        terminal: true
        expected_duration_sec: 300

  - id: T-20260821-workshop-free-bundle
    title: Package the Free Edition dev deployment
    effort: L
    profile: full
    agent: platform-engineer
    execution_backend: codex
    required_tools: [databricks, uv, pytest]
    depends_on: [T-20260821-workshop-incident-tracer]
    touches_paths:
      - toolchain.lock.yaml
      - tests/
      - scripts/
    creates_paths:
      - databricks.yml
      - pipelines/resources/agentic/
    source_note: Free Edition constraints and landing promise for DAB dev deploy/run
    why: The current bundle is Azure-specific, includes production assumptions, and would collide in a learner room.
    goal: Create a dev-only serverless DAB with per-user schema, managed Volume, one pipeline, one sequential job, preflight, bootstrap, and scoped reset.
    done_condition: A fresh Free Edition account can strict-validate, deploy, run, replay, and reset without editing bundle YAML.
    context: The workspace host and profile remain external; default catalog selection is verified by preflight.
    do_not_touch: [pipelines/, configs/, data/, gen/]
    anti_patterns:
      - Hard-code the instructor host or org ID.
      - Add a production target, schedule, notifications, service principal, or classic cluster.
      - Delete objects outside the normalized learner schema.
    rollback: Bundle destroy declared resources, then drop only the exact learner schema after confirmation.
    observability: Capture strict validation, deploy summary, pipeline update ID, job run ID, object inventory, and cleanup receipt.
    behaviors:
      - id: B-1
        given: an authenticated Free Edition profile
        when: the dev bundle is validated and deployed
        then: only the learner's serverless schema, Volume, pipeline, and job are created
      - id: B-2
        given: the learner chooses reset
        when: reset executes
        then: only exact bundle resources and the learner schema are removed
    evals:
      - id: eval_1
        description: dev bundle validates strictly
        command: databricks bundle validate --strict -t dev
        verifies: [B-1]
        expected_duration_sec: 120
      - id: eval_2
        description: bundle policy forbids production resources and broad cleanup
        command: uv run pytest -q tests -k bundle_policy
        verifies: [B-1, B-2]
        terminal: true
        expected_duration_sec: 60

  - id: T-20260821-workshop-genie-evidence
    title: Make the merchant incident explainable with UC and Genie
    effort: M
    profile: standard
    agent: analytics-engineer
    execution_backend: codex
    required_tools: [databricks, pytest]
    depends_on: [T-20260821-workshop-free-bundle]
    touches_paths:
      - pipelines/src/psp-agentic/gold.py
      - tests/
    creates_paths:
      - docs/genie/
    source_note: landing promise for Unity Catalog and Genie Code evidence
    why: A deployed table alone does not prove the promised natural-language investigation experience.
    goal: Add UC semantics and four rehearsed Genie Code investigations, plus an optional instructor Genie Space path when entitlement is confirmed.
    done_condition: Each question resolves to the expected merchant, metrics, and evidence shape; Genie Space status is explicitly recorded.
    context: Genie Code is mandatory and documented in Free Edition; Genie Space is additive until preflight proves availability.
    do_not_touch: [pipelines/, gen/, data/]
    anti_patterns:
      - Claim a Genie result from static SQL alone.
      - Make learner success depend on unverified Genie Space entitlement.
    rollback: Remove only workshop Genie configuration and semantic additions.
    observability: Store prompts, generated SQL, bounded result digests, and screenshots with no personal identifiers.
    behaviors:
      - id: B-1
        given: Gold and quarantine tables are populated
        when: the four Genie Code prompts are asked
        then: the answers identify the expected merchant and explain the risk change using governed data
    evals:
      - id: eval_1
        description: Genie prompts and expected results cover the landing promise
        command: uv run pytest -q tests -k genie_contract
        verifies: [B-1]
        terminal: true
        expected_duration_sec: 60

  - id: T-20260821-workshop-teaching-system
    title: Build the learner, instructor, and fallback system
    effort: L
    profile: full
    agent: technical-writer
    execution_backend: codex
    required_tools: [git, bash, pytest]
    depends_on:
      - T-20260821-workshop-contracts
      - T-20260821-workshop-genie-evidence
    touches_paths: [readme.md, data/fallback/]
    creates_paths:
      - docs/learner/
      - docs/instructor/
      - docs/fallback/
    source_note: four-hour agenda and four landing-page fallbacks
    why: The reference implementation lacks resettable learner checkpoints, recovery paths, and delivery instructions.
    goal: Produce a timed four-hour workshop, instructor cues, checkpoints, exact commands, evidence expectations, and rehearsed fallbacks.
    done_condition: Another instructor can deliver both full-live and fallback paths from the repository without undocumented knowledge.
    context: Materials label every proof as local, remote dry-run, deployed, live runtime, or replay.
    do_not_touch: [pipelines/, gen/, data/, presentation/]
    anti_patterns:
      - Add optional production topics to the core four-hour path.
      - Hide waiting time or recovery decisions.
      - Present replay as a live successful operation.
    rollback: Remove workshop materials and fallback assets without touching the reference implementation.
    observability: Link every checkpoint to a command, expected output, timebox, and recovery branch.
    behaviors:
      - id: B-1
        given: a second instructor and a fresh learner clone
        when: they follow the runbook
        then: they can choose the correct live or fallback branch at each timed gate
    evals:
      - id: eval_1
        description: materials and fallback contracts are internally complete
        command: uv run pytest -q tests -k 'materials or fallback'
        verifies: [B-1]
        terminal: true
        expected_duration_sec: 60

  - id: T-20260821-workshop-release-rehearsal
    title: Rehearse and certify every workshop promise
    effort: L
    profile: full
    agent: release-engineer
    execution_backend: codex
    required_tools: [databricks, uv, spark-pipelines, pytest, git]
    depends_on: [T-20260821-workshop-teaching-system]
    touches_paths:
      - readme.md
      - docs/
    creates_paths:
      - scripts/verify.sh
      - tests/landing_promises/
      - docs/rehearsals/
    source_note: live landing page and workshop-ready definition
    why: Individual checks do not prove that a fresh learner can complete the advertised journey inside four hours.
    goal: Run one full-live and one forced-fallback rehearsal from fresh clones and reconcile every landing promise.
    done_condition: The release receipt shows all mandatory gates passing within four hours, with external IDs and explicit gaps; otherwise readiness remains false.
    context: Deployment and cleanup need separate explicit authorization even after this TaskPlan is approved.
    do_not_touch: [pipelines/, gen/, data/, presentation/]
    anti_patterns:
      - Rehearse only from a warm developer checkout.
      - Omit cleanup verification.
      - Mark a fallback replay as live workspace proof.
    rollback: Destroy only resources identified in rehearsal receipts and preserve sanitized evidence.
    observability: Record clone SHA, toolchain digest, run IDs, object inventory, durations, promise matrix, and cleanup state.
    behaviors:
      - id: B-1
        given: two fresh clones and two Free Edition accounts
        when: full-live and forced-fallback rehearsals complete
        then: every landing promise has an inspectable pass or explicit gap and total delivery fits four hours
    evals:
      - id: eval_1
        description: all local and promise gates pass
        command: ./scripts/verify.sh --local
        verifies: [B-1]
        expected_duration_sec: 600
      - id: eval_2
        description: remote release gate passes in an authorized rehearsal
        command: ./scripts/verify.sh --remote
        verifies: [B-1]
        terminal: true
        expected_duration_sec: 1800
